services:
  - type: web
    name: agrisense
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/_healthcheck
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrisense-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: agrisense-db
    plan: basic-256mb
    databaseName: agrisense
    user: agrisense
